{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block content %}
<div class="page-head"><h1>My account</h1></div>
<div class="grid grid-2" style="max-width:960px">
  <section class="card">
    <h2>Profile</h2>
    <dl class="kv">
      <dt>Username</dt><dd>{{ user.username }}</dd>
      <dt>Role</dt><dd><span class="tag {{ 'admin' if user.is_admin }}">{{ user.role }}</span></dd>
      <dt>Name</dt><dd>{{ user.full_name or '-' }}</dd>
      <dt>E-mail</dt><dd>{{ user.email or '-' }}</dd>
    </dl>
  </section>
  <section class="card">
    <h2>Change password</h2>
    <form method="post" action="/account/password">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field"><label for="cur">Current password</label><input id="cur" name="current" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="new">New password</label><input id="new" name="new" type="password" minlength="{{ min_len }}" autocomplete="new-password" required></div>
      <div class="field"><label for="con">Confirm new password</label><input id="con" name="confirm" type="password" minlength="{{ min_len }}" autocomplete="new-password" required></div>
      <button class="btn primary" type="submit">Change password</button>
    </form>
  </section>
</div>
{% endblock %}
