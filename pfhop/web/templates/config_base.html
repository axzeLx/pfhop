{% extends "base.html" %}
{% block title %}Configuration · {{ tabs[tab] }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Postfix configuration</h1></div>
<nav class="tabs">
  {% for key, label in tabs.items() %}
    <a href="/config/{{ key }}" class="{{ 'active' if key == tab }}">{{ label }}</a>
  {% endfor %}
</nav>
<div class="tab-body">
{% block config_content %}{% endblock %}
</div>
{% endblock %}
