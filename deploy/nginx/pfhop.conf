# pfhop reverse proxy. @SERVER_NAME@ is replaced by install.sh.
# Access is limited to the networks in /etc/nginx/pfhop-allow.conf.

upstream pfhop_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name @SERVER_NAME@;
    include /etc/nginx/pfhop-allow.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name @SERVER_NAME@;

    ssl_certificate     /etc/pfhop/tls/pfhop.crt;
    ssl_certificate_key /etc/pfhop/tls/pfhop.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pfhop_ssl:5m;

    include /etc/nginx/pfhop-allow.conf;

    charset utf-8;
    client_max_body_size 10m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/pfhop.access.log;
    error_log  /var/log/nginx/pfhop.error.log;

    location /static/ {
        proxy_pass http://pfhop_app;
        expires 7d;
    }

    location / {
        proxy_pass http://pfhop_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Needed for live (Server-Sent Events) pages.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
